name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  verify-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: true

      - run: flutter pub get
      - run: flutter build linux --release
