name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (если пусто — v<версия из pubspec.yaml>)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: true

      - name: Accept Android licenses and ensure SDK components
        run: |
          SDK_MANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDK_MANAGER="$candidate"
              break
            fi
          done
          if [ -n "$SDK_MANAGER" ]; then
            set +o pipefail
            yes | "$SDK_MANAGER" --licenses > /dev/null || true
            "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          fi

      - name: Configure Android release keystore if provided
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          fi

      - name: Read app version
        id: ver
        run: |
          VERSION=$(sed -nE 's/^version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Verify APK permissions, ABIs, and resources
        run: |
          AAPT=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name aapt2 | sort -V | tail -n1)
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ -n "$AAPT" ]; then
            PERMS=$("$AAPT" dump permissions "$APK")
            echo "$PERMS"
            if echo "$PERMS" | grep -q "android.permission.INTERNET"; then
              echo "Unexpected INTERNET permission found in release APK!"
              exit 1
            fi
            RES_LIST=$("$AAPT" dump resources "$APK" | grep -E "drawable/ic_stat_pyure|drawable/splash_icon|drawable/splash_icon_legacy|drawable/audio_service_play_arrow|mipmap/ic_launcher_background|mipmap/ic_launcher_foreground|mipmap/ic_launcher_monochrome" || true)
            echo "$RES_LIST"
            for required in \
              "drawable/ic_stat_pyure" \
              "drawable/splash_icon" \
              "drawable/splash_icon_legacy" \
              "drawable/audio_service_play_arrow" \
              "mipmap/ic_launcher_background" \
              "mipmap/ic_launcher_foreground" \
              "mipmap/ic_launcher_monochrome"; do
              if ! echo "$RES_LIST" | grep -q "$required"; then
                echo "Missing required APK resource (stripped by R8/shrinkResources?): $required"
                exit 1
              fi
            done
          fi
          APK_FILES=$(unzip -l "$APK")
          for abi in "arm64-v8a" "armeabi-v7a" "x86_64"; do
            if ! echo "$APK_FILES" | grep -q "lib/$abi/libmpv.so"; then
              echo "Missing libmpv.so for ABI $abi"
              exit 1
            fi
          done

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Pyure-${{ steps.ver.outputs.version }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pyure-android
          path: dist/Pyure-*-android.apk

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: true

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $text = Get-Content -Raw pubspec.yaml
          $ver = "0.1.1"
          if ($text -match "(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)") {
            $ver = $Matches[1]
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Verify bundled MSVC runtime libraries
        shell: pwsh
        run: |
          Get-ChildItem "build\windows\x64\runner\Release" | Select-Object Name,Length

      - name: Build Windows installer (.exe)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "installer\pyure.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: pyure-windows
          path: dist/Pyure-*-windows-x64-setup.exe

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev \
            rpm fakeroot dpkg libarchive-tools zstd desktop-file-utils

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: true

      - name: Read app version
        id: ver
        run: |
          VERSION=$(sed -nE 's/^version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package Linux releases (.deb, .rpm, .pkg.tar.zst, .tar.gz)
        run: |
          sed -i 's/\r$//' linux/packaging/*.sh linux/packaging/*.desktop
          chmod +x linux/packaging/package_linux.sh linux/packaging/install.sh
          ./linux/packaging/package_linux.sh "${{ steps.ver.outputs.version }}" "build/linux/x64/release/bundle" "dist"
          dpkg-deb -I "dist/Pyure-${{ steps.ver.outputs.version }}-linux-x64.deb"
          rpm -qp --requires "dist/Pyure-${{ steps.ver.outputs.version }}-linux-x64.rpm"
          zstd -t "dist/Pyure-${{ steps.ver.outputs.version }}-linux-x64.pkg.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: pyure-linux
          path: |
            dist/Pyure-*-linux-x64.deb
            dist/Pyure-*-linux-x64.rpm
            dist/Pyure-*-linux-x64.pkg.tar.zst
            dist/Pyure-*-linux-x64.tar.gz

  publish-release:
    needs: [build-android, build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        run: |
          VERSION=$(sed -nE 's/^version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -n1)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Pyure ${{ steps.tag.outputs.name }}
          body: |
            Локальный офлайн MP3-плеер для Android (GrapheneOS, Samsung, Honor, Xiaomi, Redmi), Windows 10/11 и Linux (Debian, Ubuntu, Arch Linux, Fedora).

            Файлы:
            - `Pyure-*-android.apk` — универсальный APK для Android 7+ (GrapheneOS, Samsung, Honor, Xiaomi, Redmi; `arm64-v8a`, `armeabi-v7a`, `x86_64`).
            - `Pyure-*-windows-x64-setup.exe` — установщик для Windows 10 и Windows 11 (x64).
            - `Pyure-*-linux-x64.deb` — пакет для Debian и Ubuntu (`sudo apt install ./Pyure-*.deb`).
            - `Pyure-*-linux-x64.rpm` — пакет для Fedora (`sudo dnf install ./Pyure-*.rpm`).
            - `Pyure-*-linux-x64.pkg.tar.zst` — пакет для Arch Linux (`sudo pacman -U ./Pyure-*.pkg.tar.zst`).
            - `Pyure-*-linux-x64.tar.gz` — портативный архив для Linux (`bash install.sh`).
          files: |
            release-assets/*
